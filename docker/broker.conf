# =====================================================================
#  RocketMQ Broker 配置
# =====================================================================

brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0

# ⚠️⚠️ 这一行是 Docker 里跑 RocketMQ 最容易翻车的地方。
#
#   broker 启动时会把自己「可达的地址」注册到 NameServer，客户端拿到这个地址后
#   直接去连。默认情况下它注册的是【容器内网 IP】（如 172.17.0.2），
#   而 Windows/macOS 的 Docker Desktop 里，容器网段在宿主机上是【不可路由】的。
#   症状很有迷惑性：NameServer 连得上、能拿到路由信息，但发消息时
#   报 「sendDefaultImpl call timeout」或 「connect to 172.17.0.2:10911 failed」。
#
#   写成 127.0.0.1 之后，broker 注册的就是宿主机的回环地址，
#   再配合 compose 里的端口映射（10911:10911），宿主机上的应用就能连上。
brokerIP1 = 127.0.0.1

# 异步刷盘 + 异步复制：牺牲极端情况下的可靠性换吞吐。
# 本项目是求职演示 + 秒杀场景，追求的是「扛住瞬时流量」，
# 而消息丢了也有兜底（超时关单有定时扫描兜底，见 OrderTimeoutTask 的说明）。
# 生产上资金相关的消息必须用 SYNC_FLUSH。
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# 消息保留 48 小时
fileReservedTime = 48
deleteWhen = 04

# ⚠️ 生产环境必须关掉：允许自动创建 Topic 意味着任何客户端都能凭空造 Topic，
# 无法统一管理分区数与权限。本项目开着是为了演示与压测时省事。
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

# 单个 Topic 默认队列数。秒杀 Topic 会单独指定更多队列以提高并行度。
defaultTopicQueueNums = 4
